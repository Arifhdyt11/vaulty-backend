# Vaulty di ylabs (~/apps/vaulty): backend v2 (api, worker, migrate, redis) dan web dalam satu
# project. Image dibuild di Mac lalu dikirim (docker save | ssh docker load); server tidak build.
# - backend: vaulty-backend/scripts/deploy.sh (menyalin compose ini ke server).
# - web: vaulty-frontend/scripts/deploy.sh (hanya kirim image lalu buat ulang service web).
# DB `vaulty2` di shared-postgres (network data), AI lewat hermes + 9router (network web).
# Publik hanya lewat nginx: vaulty.conf → vaulty-api:8080 (port 8080) dan vaulty-web.conf
# (https://vaulty.reepzs.site: /api/ → vaulty-api:8080, sisanya → vaulty-web:3000).
# Env di .env.backend (chmod 600, tidak di-commit; lihat deploy/.env.backend.example).
name: vaulty

x-app: &app
  image: vaulty-backend:v2
  restart: unless-stopped
  env_file: .env.backend
  # secrets/ (chmod 700, tidak di-commit) berisi service account FCM. Mount folder,
  # bukan file: bila file belum ada, Docker tidak membuat direktori palsu di path-nya.
  volumes: [storage2:/data, ./secrets:/run/vaulty-secrets:ro]
  networks: [web, data, internal]
  depends_on: [redis]

services:
  migrate:
    <<: *app
    container_name: vaulty-migrate
    command: ["migrate"]
    restart: "no"
    profiles: [tools]

  api:
    <<: *app
    container_name: vaulty-api
    command: ["api"]
    mem_limit: 200m

  worker:
    <<: *app
    container_name: vaulty-worker
    command: ["worker"]
    # ffmpeg (TTS → AAC, frame video) butuh ruang lebih dari api.
    mem_limit: 350m

  redis:
    image: redis:7-alpine
    container_name: vaulty-redis
    restart: unless-stopped
    # Antrean asynq: noeviction + appendonly supaya job tidak hilang.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction", "--save", ""]
    volumes: [redis2:/data]
    mem_limit: 64m
    networks: [internal]

  web:
    image: vaulty-frontend:latest
    container_name: vaulty-web
    restart: unless-stopped
    # Heap Node dibatasi 96 MB di Dockerfile.
    mem_limit: 160m
    networks: [web]

networks:
  web: { external: true }
  data: { external: true }
  internal: {}

# Volume baru (bukan milik v1) supaya file & antrean lama tidak tercampur.
volumes:
  storage2:
  redis2:
