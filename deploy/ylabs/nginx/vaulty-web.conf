# Dipasang ke ~/infra/nginx/conf.d/vaulty-web.conf oleh remote-deploy.sh (bila berubah, setelah nginx -t).
# vaulty.reepzs.site: web Next (vaulty-web:3000) + API Go (vaulty-api:8080) di origin yang sama,
# jadi browser tidak butuh CORS. Zona vaulty_auth didefinisikan di vaulty.conf.
# Sertifikat: certbot webroot (docker), diperpanjang cron ~/scripts/renew-certs.sh.

server {
    listen 80;
    server_name vaulty.reepzs.site;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vaulty.reepzs.site$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vaulty.reepzs.site;

    ssl_certificate     /etc/letsencrypt/live/vaulty.reepzs.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaulty.reepzs.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Resolve ulang: IP container berganti setiap kali di-recreate saat deploy.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $vaulty_api http://vaulty-api:8080;
    set $vaulty_web http://vaulty-web:3000;

    location ~ ^/api/v[0-9]+/auth/ {
        limit_req        zone=vaulty_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass       $vaulty_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         $vaulty_api;
        proxy_http_version 1.1;
        client_max_body_size 30m;   # MAX_UPLOAD_MB=25 + overhead multipart
        proxy_read_timeout 120s;    # respons Vee (LLM) bisa lama
        proxy_buffering    off;     # streaming SSE /chat
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         $vaulty_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
