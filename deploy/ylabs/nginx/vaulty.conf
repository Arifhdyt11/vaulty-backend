# Vaulty API (Go) di port 8080, HTTP. Lihat ~/apps/vaulty. Swagger: /api/docs
# Login dibatasi per IP supaya tebakan password lambat.
limit_req_zone $binary_remote_addr zone=vaulty_auth:1m rate=1r/s;

server {
    listen 8080;
    server_name _;

    # Resolve ulang tiap 30 detik: IP container berganti setiap kali vaulty-api di-recreate saat deploy.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $vaulty_api http://vaulty-api:8080;

    client_max_body_size 30m;   # MAX_UPLOAD_MB=25 + overhead multipart

    location ~ ^/api/v[0-9]+/auth/ {
        limit_req        zone=vaulty_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass       $vaulty_api;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         $vaulty_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # respons Vee (LLM) bisa lama
        proxy_buffering    off;    # streaming SSE
    }
}
