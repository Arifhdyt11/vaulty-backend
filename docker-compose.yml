# Dependensi development: Postgres (pgvector), Redis; MinIO opsional (profile s3) sebagai pengganti R2.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: vaulty2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaulty
      POSTGRES_USER: vaulty
      POSTGRES_PASSWORD: vaulty
    ports: ["127.0.0.1:5435:5432"]
    volumes: [vaulty2-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaulty"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vaulty2-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]

  # Opsional (profile s3): docker compose --profile s3 up -d. Default dev memakai disk lokal.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vaulty2-minio
    restart: unless-stopped
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vaulty
      MINIO_ROOT_PASSWORD: vaultyvaulty
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [vaulty2-minio:/data]

volumes:
  vaulty2-pgdata:
  vaulty2-minio:
