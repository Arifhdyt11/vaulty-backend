version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: queries
        out: internal/repository/queries
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: vector
            go_type: { import: github.com/pgvector/pgvector-go, type: Vector }
          - db_type: vector
            nullable: true
            go_type: { import: github.com/pgvector/pgvector-go, type: Vector, pointer: true }
          - db_type: jsonb
            go_type: { type: "[]byte" }
